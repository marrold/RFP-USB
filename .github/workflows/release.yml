# Publishes the firmware builds to a GitHub release: one .uf2 per GEEK, named
# so that a download tells you which board it is for.
#
# Only a tag triggers it, and only a tag whose commit is on main or master: a
# tag pushed from a side branch would otherwise cut a release of code that was
# never merged, and nothing about the tag itself says which branch it came
# from.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # to create the release and attach the .uf2 files to it

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          submodules: recursive   # lib/sd_fatfs, without which CMake stops
          fetch-depth: 0          # the branch check needs history, not a shallow tip

      - name: Refuse a tag that is not on main or master
        run: |
          set -euo pipefail

          # A tag checkout does not necessarily bring the branches with it.
          git fetch --quiet --unshallow origin 2>/dev/null || true
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'

          for branch in origin/main origin/master; do
            if git rev-parse --verify --quiet "$branch" >/dev/null &&
               git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              echo "$GITHUB_REF_NAME is on $branch"
              exit 0
            fi
          done

          echo "::error::$GITHUB_REF_NAME is not on main or master; not releasing"
          exit 1

      - name: Build the toolchain image
        run: docker build -t rfp-usb-build .

      # The tag is handed to the build rather than left for it to work out, so
      # that the version the mode menu shows is the same string as the one in
      # the filenames below instead of a second, independent guess at it.
      - name: Build the firmware for both boards
        env:
          RFP_VERSION: ${{ github.ref_name }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src" \
            --env RFP_VERSION \
            rfp-usb-build \
            tools/build-firmware.sh 2040 2350

      # A release that quietly went out with one of the two missing would be
      # worse than one that failed, so both are required by name rather than
      # globbed for.
      - name: Name the artefacts after the tag
        run: |
          set -euo pipefail
          for variant in 2040 2350; do
            cp "build/rfp-usb-$variant.uf2" \
               "rfp-usb-$variant-${GITHUB_REF_NAME}.uf2"
          done
          ls -l rfp-usb-*-"${GITHUB_REF_NAME}".uf2

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "rfp-usb-2040-${GITHUB_REF_NAME}.uf2" \
            "rfp-usb-2350-${GITHUB_REF_NAME}.uf2"
